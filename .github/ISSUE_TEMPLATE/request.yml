name: 다음 책 제안
description: 읽고 싶은 새 책의 주제를 제안해 주세요.
title: "[새 책] "
body:
  - type: input
    id: topic
    attributes:
      label: 원하는 주제
      placeholder: 예) 배터리의 작동 원리
    validations:
      required: true
  - type: textarea
    id: reason
    attributes:
      label: 읽고 싶은 이유
      description: 알고 싶은 질문이나 직접 해 보고 싶은 실험이 있으면 적어 주세요.
    validations:
      required: true
