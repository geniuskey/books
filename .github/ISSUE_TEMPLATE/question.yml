name: 내용 질문
description: 책을 읽다가 이해되지 않은 부분을 질문해 주세요.
title: "[질문] "
body:
  - type: input
    id: book
    attributes:
      label: 책 이름
      placeholder: 예) MemoryBook
    validations:
      required: true
  - type: input
    id: page
    attributes:
      label: 해당 페이지 URL
      description: 가능하면 주소창의 링크를 붙여 주세요.
    validations:
      required: false
  - type: textarea
    id: question
    attributes:
      label: 궁금한 점
      description: 이해되지 않은 부분과 궁금한 점을 적어 주세요.
    validations:
      required: true
