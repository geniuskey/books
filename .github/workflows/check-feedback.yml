name: Check feedback API
on:
  push:
    branches: [main]
    paths:
      - 'worker/**'
      - 'js/feedback.js'
      - 'js/feedback-inbox.js'
      - 'feedback.html'
      - '**/*.html'
      - 'js/**'
      - 'tools/check-routes.py'
      - 'tools/build-fields.py'
      - 'data/feedback-config.json'
      - 'data/books.json'
      - '.github/workflows/check-feedback.yml'
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci
        working-directory: worker
      - run: python3 tools/check-routes.py
      - run: node --test worker/test/*.test.js
      - run: node --check js/feedback.js
      - run: node --check js/feedback-inbox.js
