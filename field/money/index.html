<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>돈·부동산 지식 지도 · Books</title>
<meta name="description" content="분야별 지식 지도의 새 주소로 이동합니다.">
<meta name="robots" content="noindex">
<link rel="canonical" href="https://books.euiyun.com/paths/">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<script>
(function () {
  const params = new URLSearchParams(location.search);
  const fields = ["semiconductor", "computing", "electronics", "money", "health", "culture"];
  const aliases = {"ai": "computing", "housing": "money", "art": "culture"};
  for (const key of ["f", "field"]) {
    if (Object.hasOwn(aliases, params.get(key))) params.set(key, aliases[params.get(key)]);
  }
  const field = "money" || (fields.includes(params.get("f")) ? params.get("f") : fields.includes(params.get("field")) ? params.get("field") : "");
  params.delete("f");
  params.set("view", "map");
  if (field) params.set("field", field); else params.delete("field");
  location.replace("/paths/?" + params + location.hash);
})();
</script>
